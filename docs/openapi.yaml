      properties:
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
        student_id:
          type: string
          nullable: true
          pattern: '^[0-9]{6,12}$'
        faculty:
          type: string
          nullable: true
          maxLength: 255
    LoginRequest:
      type: object
      required: [password]
      anyOf:
        - required: [email]
        - required: [identifier]
      properties:
        identifier:
          type: string
          maxLength: 255
          description: Email address or student ID.
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, email, password]
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    UpdateProfileRequest:
