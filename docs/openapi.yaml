# Only implemented and tested endpoints are listed (plan.md 9.3, D-28); a test compares this file
# with the registered routes and with real responses. Planned endpoints are in
# docs/api/endpoints-index.md. The response baseline (D-24 PROPOSED, D-31) is not the final
# contract: Q-24 stays OPEN until the frontend developer confirms it.
# The security scheme records the approved authentication decision (Q-29, D-19).
openapi: 3.0.3
info:
  title: UniMate API
  version: 0.0.0
  description: >-
    Authentication, the current user, academic reference data (majors, plans,
    courses, requirement categories) and stateless semester and cumulative average
    calculators, and admin-only digital library management (subjects, and resources:
    upload, list, detail, metadata update and permanent delete), and student library
    reads (subjects, their visible resources, resource detail and a streamed download), and
    a student's own tasks (create, list, partial update with completion, permanent delete, and
    the due_on, due_before and completed filters), own journals (create and list only), and
    focus sessions (start, and complete or cancel; no list, detail or delete), graduation-project
    announcements with join applications and the owner's decisions, and a read-only list of student
    accounts for the admin, with the admin's suspension of student accounts and the append-only
    audit log.
    Library search and filters, and all other planned endpoints, are listed in
    docs/api/endpoints-index.md and are not available yet.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a student account
      description: >-
        Creates a STUDENT account. The role is always set by the server and any
        role in the request is ignored. This response never contains a token.
        The accepted fields are interim (decision D-41, question Q-62).
        A duplicate email is reported as a validation error, which is the
        documented exception to account non-disclosure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in (trusted BFF only)
      description: >-
        The only endpoint that returns an access token, intended for the trusted
        Next.js BFF (decision D-18). Sending the BFF shared secret is not required
        to log in: it only lets the API trust the forwarded client IP (decision
        D-17). A wrong email and a wrong password give the same 401.
        A SUSPENDED account gets 403 FORBIDDEN, and only after a correct password
        (owner decision D-81); no token is issued.
        The token lifetime is 7 days for a student and 8 hours for an admin,
        chosen from the stored role. The response is never cacheable.
      security: []
      parameters:
        - $ref: '#/components/parameters/BffSecret'
        - $ref: '#/components/parameters/BffClientIp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: >-
        Revokes the access token used for this request only. A SUSPENDED account gets
        403 FORBIDDEN, as on every authenticated request (owner decision D-81).
      responses:
        '204':
          description: The token was revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset link
      description: >-
        The answer is the same whether or not an account exists. The link is built
        from the configured frontend URL, never from request headers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: The request was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset a password with a reset token
      description: >-
        A successful reset revokes every access token of the account. A wrong,
        expired or already used token, and an unknown email, all give the same 422.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: The password was reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /majors:
    get:
      tags: [Academic]
      summary: List majors
      description: >-
        Read-only reference data for students. Ordered by id. No filters or search:
        their conventions are open (question Q-60). Colleges and universities are
        not modelled yet (Q-32, Q-33). Access is limited to students, which is
        provisional (decision proposal D-45, question Q-62).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of majors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MajorList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /academic-plans:
    get:
      tags: [Academic]
      summary: List academic plans
      description: >-
        Read-only reference data for students. Ordered by id. Access is limited to
        students, which is provisional (decision proposal D-45, question Q-62).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of plans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlanList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /academic-plans/{id}:
    get:
      tags: [Academic]
      summary: Get an academic plan
      description: >-
        Each plan has its own total required hours; no fixed number applies to all
        majors.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlanResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /academic-plans/{id}/courses:
    get:
      tags: [Academic]
      summary: List the courses of a plan
      description: >-
        Only the courses of this plan. A course may belong to one plan and not
        another.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of the plan's courses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanCourseList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /academic-plans/{id}/requirements:
    get:
      tags: [Academic]
      summary: List the requirement categories of a plan
      description: >-
        University, college and major requirements, mandatory or elective, with
        their required hours. The field names are provisional.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of requirement categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementCategoryList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /students/me/academic-plan:
    get:
      tags: [Academic]
      summary: Read the student's own academic plan
      description: >-
        STUDENT only, with exactly the same authorization as the PUT on this path: a guest gets 401,
        and an ADMIN or a suspended account gets 403 (owner decision D-91). Returns the plan the
        authenticated student assigned with PUT, in the same representation, or `{"data": null}`
        when no plan has been assigned yet. It reads only the caller's own assignment and never
        creates one. Any query parameter, such as user_id, is ignored.
      responses:
        '200':
          description: The student's plan and its major, or data null when none is assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAcademicPlanReadResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Academic]
      summary: Choose the student's own academic plan
      description: >-
        STUDENT only: a guest gets 401 and an ADMIN gets 403. Sets the plan the authenticated student follows (D-86). The major is derived from the plan on the server; only academic_plan_id is read, and user_id, major_id and any other field are ignored. The student has one profile row, created the first time and updated afterwards, so the call is idempotent and the plan can be changed. It answers 200 whether the row was created or updated. An unknown or malformed plan is a 422 on academic_plan_id. There is no GET, DELETE or other method on this path, and no course records, progress or average (questions Q-34 to Q-36 stay open).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentAcademicPlanRequest'
      responses:
        '200':
          description: The student's plan and its major.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAcademicPlanResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /students/me/courses:
    get:
      tags: [Academic]
      summary: List the student's own course attempts
      description: >-
        STUDENT only with an active account: a guest gets 401, and an ADMIN or a suspended account gets 403. Storage and retrieval of the student's OWN unofficial course attempts (owner decisions D-96 to D-100). Nothing here classifies an attempt as passed, failed or excluded, chooses between retakes, or calculates progress or an average; a null grade means only that no final grade has been entered, not an official enrolment status. Every attempt carries source STUDENT_ENTERED. Paginated and ordered by course_id, then attempt_number, then id. There are
        no filters and no sorting options; unknown query parameters are ignored.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of the student's attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCourseAttemptList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Academic]
      summary: Record a course attempt
      description: >-
        STUDENT only with an active account: a guest gets 401, and an ADMIN or a suspended account gets 403. Storage and retrieval of the student's OWN unofficial course attempts (owner decisions D-96 to D-100). Nothing here classifies an attempt as passed, failed or excluded, chooses between retakes, or calculates progress or an average; a null grade means only that no final grade has been entered, not an official enrolment status. Every attempt carries source STUDENT_ENTERED. course_id may be any existing catalogue course; no assigned plan is needed
        (D-97). attempt_number is assigned by the server as the highest existing number for this
        student and course plus one; sending attempt_number is a 422. At most one ungraded attempt per
        student and course may exist: creating a second one is a 422 on course_id. Unknown fields such
        as student_id are ignored; the owner is always the authenticated student.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentCourseAttemptRequest'
      responses:
        '201':
          description: The attempt was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCourseAttemptResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /students/me/courses/{id}:
    patch:
      tags: [Academic]
      summary: Correct a course attempt
      description: >-
        STUDENT only with an active account: a guest gets 401, and an ADMIN or a suspended account gets 403. Storage and retrieval of the student's OWN unofficial course attempts (owner decisions D-96 to D-100). Nothing here classifies an attempt as passed, failed or excluded, chooses between retakes, or calculates progress or an average; a null grade means only that no final grade has been entered, not an official enrolment status. Every attempt carries source STUDENT_ENTERED. Only grade and semester_label can change: an omitted field stays unchanged
        and an explicit null clears it (grade 0 is a real grade). course_id and attempt_number are
        immutable; sending either, even as null, is a 422. An empty body, or one with only unsupported
        fields, is a 422 on attempt. Clearing a grade is a 422 on grade when another attempt of the same
        course is already ungraded. Another student's attempt answers exactly like a missing one: 404.
      parameters:
        - $ref: '#/components/parameters/CourseAttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentCourseAttemptRequest'
      responses:
        '200':
          description: The updated attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCourseAttemptResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Academic]
      summary: Delete a course attempt
      description: >-
        STUDENT only with an active account: a guest gets 401, and an ADMIN or a suspended account gets 403. Storage and retrieval of the student's OWN unofficial course attempts (owner decisions D-96 to D-100). Nothing here classifies an attempt as passed, failed or excluded, chooses between retakes, or calculates progress or an average; a null grade means only that no final grade has been entered, not an official enrolment status. Every attempt carries source STUDENT_ENTERED. A hard delete of the student's own attempt. The remaining attempts keep their
        numbers (no renumbering); deleting the highest-numbered attempt lets that number be assigned
        again, so attempt_number orders the attempts currently stored and is not a historical sequence;
        id is the stable identifier. Another student's attempt answers exactly like a missing one: 404.
      parameters:
        - $ref: '#/components/parameters/CourseAttemptId'
      responses:
        '204':
          description: The attempt was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /interest-tests/active:
    get:
      tags: [Interest assessment]
      summary: Read the active interest-assessment version
      description: >-
        Interest assessment engine (owner decisions D-101 to D-105). STUDENT only with an active account: a guest gets 401, an ADMIN or a suspended account 403; there is no administrator access. Results are NON-BINDING GUIDANCE indicators only: no diagnostic, eligibility, scientific-validation or university-endorsement claim, and no use in any other module. No production content is approved yet: the engine runs on imported content versions, and production activation is blocked until real content is approved (D-102). Weights are never returned. There is no 409. Read-only: it never creates, abandons or changes an attempt; the frontend
        starts an attempt explicitly with POST /interest-attempts. Questions and options are in
        display order, without weights or categories. 404 while no version is active.
      responses:
        '200':
          description: The active version's questions and options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestActiveTestResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /interest-attempts:
    post:
      tags: [Interest assessment]
      summary: Start a new attempt
      description: >-
        Interest assessment engine (owner decisions D-101 to D-105). STUDENT only with an active account: a guest gets 401, an ADMIN or a suspended account 403; there is no administrator access. Results are NON-BINDING GUIDANCE indicators only: no diagnostic, eligibility, scientific-validation or university-endorsement claim, and no use in any other module. No production content is approved yet: the engine runs on imported content versions, and production activation is blocked until real content is approved (D-102). Weights are never returned. There is no 409. Creates a new IN_PROGRESS attempt on the version that is ACTIVE when the
        transaction commits, and atomically marks the student's previous unfinished attempt
        ABANDONED (at most one IN_PROGRESS attempt per student, enforced by the database). The body
        is optional; a sent test_id must equal the active version's id. No active version, or a
        different test_id, is a 422. Retakes have no limit or cooldown (the API rate limits apply).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartInterestAttemptRequest'
      responses:
        '201':
          description: The new attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestAttemptResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /interest-attempts/{id}:
    get:
      tags: [Interest assessment]
      summary: Read one of the student's attempts
      description: >-
        Interest assessment engine (owner decisions D-101 to D-105). STUDENT only with an active account: a guest gets 401, an ADMIN or a suspended account 403; there is no administrator access. Results are NON-BINDING GUIDANCE indicators only: no diagnostic, eligibility, scientific-validation or university-endorsement claim, and no use in any other module. No production content is approved yet: the engine runs on imported content versions, and production activation is blocked until real content is approved (D-102). Weights are never returned. There is no 409. The attempt's state, the questions and options of ITS OWN content version
        (which may no longer be the active one) and its saved answers. Read-only: it never creates,
        abandons or modifies an attempt. Another student's attempt answers exactly like a missing one.
      parameters:
        - $ref: '#/components/parameters/InterestAttemptId'
      responses:
        '200':
          description: The attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestAttemptResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /interest-attempts/{id}/answers:
    put:
      tags: [Interest assessment]
      summary: Save answers (per-question upsert)
      description: >-
        Interest assessment engine (owner decisions D-101 to D-105). STUDENT only with an active account: a guest gets 401, an ADMIN or a suspended account 403; there is no administrator access. Results are NON-BINDING GUIDANCE indicators only: no diagnostic, eligibility, scientific-validation or university-endorsement claim, and no use in any other module. No production content is approved yet: the engine runs on imported content versions, and production activation is blocked until real content is approved (D-102). Weights are never returned. There is no 409. Each listed question's answer is inserted or replaced; questions not listed
        keep their answers. An empty list is a successful no-op, but only for the student's own
        IN_PROGRESS attempt. A question outside the attempt's version, an option of another question,
        or the same question twice in one request is a 422 on that item; an attempt that is not
        IN_PROGRESS (submitted or abandoned) is a 422 on attempt.
      parameters:
        - $ref: '#/components/parameters/InterestAttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveInterestAnswersRequest'
      responses:
        '200':
          description: The attempt with its saved answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestAttemptResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /interest-attempts/{id}/submit:
    post:
      tags: [Interest assessment]
      summary: Submit an attempt
      description: >-
        Interest assessment engine (owner decisions D-101 to D-105). STUDENT only with an active account: a guest gets 401, an ADMIN or a suspended account 403; there is no administrator access. Results are NON-BINDING GUIDANCE indicators only: no diagnostic, eligibility, scientific-validation or university-endorsement claim, and no use in any other module. No production content is approved yet: the engine runs on imported content versions, and production activation is blocked until real content is approved (D-102). Weights are never returned. There is no 409. Atomic: every question must be answered (otherwise 422 on answers), the
        attempt is scored once with its own version (CATEGORY_ATTAINMENT_V1, D-103), the result is
        stored, and the attempt becomes SUBMITTED. A repeated submission is a 422 on attempt and
        changes nothing. An attempt on a retired version remains submittable.
      parameters:
        - $ref: '#/components/parameters/InterestAttemptId'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestResultResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /interest-attempts/{id}/result:
    get:
      tags: [Interest assessment]
      summary: Read the result of a submitted attempt
      description: >-
        Interest assessment engine (owner decisions D-101 to D-105). STUDENT only with an active account: a guest gets 401, an ADMIN or a suspended account 403; there is no administrator access. Results are NON-BINDING GUIDANCE indicators only: no diagnostic, eligibility, scientific-validation or university-endorsement claim, and no use in any other module. No production content is approved yet: the engine runs on imported content versions, and production activation is blocked until real content is approved (D-102). Weights are never returned. There is no 409. 404 unless the caller's own attempt has been submitted (an in-progress or
        abandoned attempt has no result). Previous results remain readable after retakes.
      parameters:
        - $ref: '#/components/parameters/InterestAttemptId'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestResultResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/me/interest-attempts:
    get:
      tags: [Interest assessment]
      summary: List the student's own attempts
      description: >-
        Interest assessment engine (owner decisions D-101 to D-105). STUDENT only with an active account: a guest gets 401, an ADMIN or a suspended account 403; there is no administrator access. Results are NON-BINDING GUIDANCE indicators only: no diagnostic, eligibility, scientific-validation or university-endorsement claim, and no use in any other module. No production content is approved yet: the engine runs on imported content versions, and production activation is blocked until real content is approved (D-102). Weights are never returned. There is no 409. Paginated, newest first: started_at descending, then id descending. Summary
        rows only: no questions, answers, weights or scores.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of the student's attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestAttemptList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /calculators/semester-average:
    post:
      tags: [Calculators]
      summary: Calculate a semester average
      description: >-
        Weighted average on the 100-point scale: sum of grade times hours divided by
        the sum of hours. Stateless: nothing is read from academic records and
        nothing is stored. There is no 4.0 scale. The result is rounded to two
        decimals after exact arithmetic. A total of zero hours returns a 422 (owner
        decision D-90). STUDENT only; guests are not supported (owner decision D-89).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemesterAverageRequest'
      responses:
        '200':
          description: The calculation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterAverageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /calculators/cumulative-average:
    post:
      tags: [Calculators]
      summary: Calculate a cumulative average
      description: >-
        (previous average times previous hours plus current semester average times
        current hours) divided by the total hours. Stateless and on the 100-point
        scale. A total of zero hours returns a 422 (owner decision D-90). STUDENT only;
        guests are not supported (owner decision D-89).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CumulativeAverageRequest'
      responses:
        '200':
          description: The calculation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CumulativeAverageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /calculators/predict-average:
    post:
      tags: [Calculators]
      summary: Predict a cumulative average (estimate)
      description: >-
        A stateless forward prediction (owner decision D-93): the confirmed cumulative formula
        applied to the current average and hours that the student supplies plus hypothetical new
        courses, that is (current average x current hours + sum of grade x hours) divided by
        (current hours + hypothetical hours), computed exactly and rounded to two decimals. It is
        an estimate from the caller's own numbers, NOT an official academic average: nothing is
        read from academic records and nothing is stored. Every hypothetical course is added as
        new hours; replacing a retaken course is out of scope (question Q-04). STUDENT only
        (D-89). Zero hypothetical hours is a 422 on courses (D-90). The numeric limits are
        technical validation limits, not university policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictAverageRequest'
      responses:
        '200':
          description: The prediction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictAverageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/library/subjects:
