          additionalProperties: false
          required: [predicted_average, predicted_total_hours, hypothetical_average, hypothetical_hours]
          description: An estimate, not an official academic average.
          properties:
            predicted_average:
              type: number
              description: The predicted cumulative average, rounded to two decimals.
            predicted_total_hours:
              type: number
              description: Current hours plus hypothetical hours.
