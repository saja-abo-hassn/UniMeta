    SubjectIdFilter:
      name: subject_id
      in: query
      required: false
      description: Only resources of this subject. A non-positive or non-numeric value is rejected with 422.
      schema:
        type: integer
        minimum: 1
    BffSecret:
      name: X-BFF-Secret
      in: header
      required: false
      description: >-
        Shared secret of the trusted BFF, accepted on any request. It is optional:
        its only effect is to let the API trust X-BFF-Client-IP. It is not an
        end-user credential and not a security scheme (decision D-17). The header
        name is proposed.
      schema:
        type: string
        format: password
    BffClientIp:
      name: X-BFF-Client-IP
      in: header
      required: false
      description: >-
        The real client address, used for rate limiting. Honoured only together
        with a valid shared secret. The header name is proposed.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: >-
        Page number, starting at 1. A page beyond the last returns 200 with an
        empty data list and accurate meta. Rejecting invalid values with 422 is a
        provisional detail.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Items per page. Rejecting values above the maximum with 422 is a provisional detail.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The action is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or is hidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: The path exists but does not support this HTTP method.
      headers:
        Allow:
          description: Methods the path supports.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: The request is larger than the server accepts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The service is temporarily unavailable.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: The submitted data failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    RateLimited:
      description: The client exceeded the allowed request rate.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - bearerAuth: []
