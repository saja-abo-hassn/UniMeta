      summary: Get a library resource
      description: >-
        STUDENT only. A HIDDEN resource is answered exactly like a missing one (404
        NOT_FOUND, identical body), so its existence is not revealed. file_path, uploaded_by,
        updated_by and visibility_status are never returned to students.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLibraryResourceResponse'
