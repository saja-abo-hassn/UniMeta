      properties:
        current_average:
          type: number
          minimum: 0
          maximum: 100
          description: On the 100-point scale, at most four decimal places.
        current_hours:
          type: number
          minimum: 0
          maximum: 100000
          description: May be 0 for a student with no previous hours. At most four decimal places.
        courses:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [grade, credit_hours]
            properties:
              name:
                type: string
                maxLength: 255
                nullable: true
                description: Optional label. It is never stored or returned.
              grade:
                type: number
                minimum: 0
                maximum: 100
              credit_hours:
                type: number
                minimum: 0
                maximum: 1000
