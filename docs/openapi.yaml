components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Laravel Sanctum Personal Access Token, sent in the Authorization header
        as a Bearer token. Used by the trusted Next.js BFF only.
  schemas:
    ErrorCode:
      type: string
      description: >-
        General technical code. Business error codes are not defined yet. The first
        seven are the original codes; METHOD_NOT_ALLOWED, PAYLOAD_TOO_LARGE and
        SERVICE_UNAVAILABLE were added by decision D-35.
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_FAILED
        - RATE_LIMITED
        - SERVER_ERROR
        - METHOD_NOT_ALLOWED
        - PAYLOAD_TOO_LARGE
        - SERVICE_UNAVAILABLE
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [message, code]
      properties:
        message:
          type: string
          description: Human-readable text. Clients must rely on the status and code, not on this text.
        code:
          $ref: '#/components/schemas/ErrorCode'
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [message, code, errors]
      properties:
        message:
          type: string
        code:
          type: string
          enum: [VALIDATION_FAILED]
        errors:
          type: object
          description: Messages by field. Nested fields use dot notation, such as users.0.email.
          additionalProperties:
            type: array
            items:
              type: string
    MessageResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [message]
          properties:
            message:
              type: string
    User:
      type: object
      additionalProperties: false
      required: [id, full_name, email, role]
      description: >-
        The field set is a provisional detail. Student fields and account status
        are intentionally absent (decisions D-39 and D-41).
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [STUDENT, ADMIN]
    UserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    LoginResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [token, expires_at, user]
          properties:
            token:
              type: string
              description: Bearer access token. Returned by this response only, for the trusted BFF.
            expires_at:
              $ref: '#/components/schemas/Timestamp'
            user:
              $ref: '#/components/schemas/User'
    RegisterRequest:
      type: object
      required: [full_name, email, password]
