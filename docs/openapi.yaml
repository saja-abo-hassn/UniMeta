  /library/resources/{id}/download:
    get:
      tags: [Library]
      summary: Download a library resource
      description: >-
        STUDENT only, VISIBLE resources only (a hidden or missing resource is the same 404
        NOT_FOUND). The file is streamed, never buffered, and the caller is normally the
        Next.js BFF holding the student's Bearer token (decision P4-1, D-13): the BFF forwards
        the token and the D-17 headers, streams the body and these headers to the browser and
        must not cache it. There are no signed or temporary URLs: access is authorized on
        every request. No Range support (Accept-Ranges is none, a Range header is ignored and
        the whole file is returned) and no inline preview. The file name is the sanitized
        title plus the extension in the UTF-8 filename* parameter, with resource-{id}.{ext}
        as the plain filename fallback. A visible resource whose stored file is missing is a
        generic 500 SERVER_ERROR. Downloads are not audited. Rate limited per student
        (the limit value is provisional).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition:
              description: attachment, with filename* (UTF-8) and the resource-{id}.{ext} fallback filename.
              schema:
                type: string
            Content-Length:
              description: The size of the stored file in bytes.
              schema:
                type: integer
            X-Content-Type-Options:
              description: Always nosniff.
              schema:
                type: string
            Cache-Control:
              description: private, no-store.
              schema:
                type: string
            Accept-Ranges:
              description: Always none.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/library/resources:
    get:
      tags: [Library (admin)]
      summary: List library resources
      description: >-
        ADMIN only. Lists every resource, VISIBLE and HIDDEN, ordered by id. The only
        filter is the optional subject_id; search and other filters are deferred. An
        unknown subject_id returns an empty page. file_path is never returned.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SubjectIdFilter'
      responses:
        '200':
          description: A page of resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResourceList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Library (admin)]
      summary: Upload a library resource
      description: >-
        ADMIN only. Multipart upload through the Next.js BFF with the user's Bearer token
        (decision P4-1, option A: no signed or presigned URLs and no direct browser access
        to Laravel). visibility_status is required and has no default. The file must be a
        PDF, DOCX or PPTX of at most 20 MiB (20,480 KiB), checked by extension, server-detected
        MIME type and real structure; macro-enabled documents, arbitrary ZIP archives,
        executables and every other type are rejected, and client-supplied MIME types and
        file names are never trusted. The file is stored privately under a random key that
        the API never returns. uploaded_by is the authenticated admin. Application
        validation alone does not guarantee a 20 MiB upload in a deployment: PHP, the web
        server and the Next.js host must allow it (see the deployment documentation). A
        request larger than the server accepts is a 413. There is no virus scanning
        (unresolved limitation). Rate limited per admin (provisional).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateLibraryResourceRequest'
      responses:
        '201':
          description: The resource was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/library/resources/{id}:
    get:
      tags: [Library (admin)]
      summary: Get a library resource
      description: ADMIN only. Returns the resource whether it is VISIBLE or HIDDEN. file_path is never returned.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Library (admin)]
      summary: Update a library resource's metadata
      description: >-
        ADMIN only. JSON, metadata only: title, description, resource_type,
        visibility_status and subject_id (the target subject must exist). Only the fields
        sent change; a required field cannot be null. Replacing the file is not supported
        and a file input is a validation error. Storage fields and the audit users are never
        client-editable. updated_by is set to the authenticated admin on every successful
        update. Hiding a resource is reversible through this operation.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLibraryResourceRequest'
      responses:
        '200':
          description: The updated resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Library (admin)]
      summary: Delete a library resource permanently
      description: >-
        ADMIN only. Deletes the resource record and then, after the database transaction
        commits, its stored file. The deletion is permanent and cannot be undone; hiding
        through PATCH is the reversible alternative. If the stored file cannot be removed,
        the failure is logged without paths and the response is still 204.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: The resource was deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks:
    get:
      tags: [Productivity]
      summary: List the student's own tasks
      description: >-
        STUDENT only: a guest gets 401 and an ADMIN gets 403. Returns only the authenticated
        student's tasks; no other student's task is ever returned. Paginated, ordered by id
        ascending (D-62). The only filters are due_on, due_before and completed (D-61, D-62);
        the client supplies the reference date, the server applies no timezone. There is no
        search or sorting, and unknown query parameters are ignored. A malformed value of an
        approved parameter is a 422. For today's tasks use due_on; for overdue tasks use
        due_before with completed=false. Tasks without a due date never match due_on or
        due_before.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: due_on
          in: query
          required: false
          description: Only tasks whose due_date equals this calendar date.
          schema:
            type: string
            format: date
        - name: due_before
          in: query
          required: false
          description: Only tasks whose due_date is strictly earlier than this calendar date.
          schema:
            type: string
            format: date
        - name: completed
          in: query
          required: false
          description: true for completed tasks (completed_at set), false for open tasks.
          schema:
            type: string
            enum: ['true', 'false', '1', '0']
      responses:
        '200':
          description: A page of the student's tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Productivity]
      summary: Create a task
      description: >-
        STUDENT only. Creates a task owned by the authenticated student; the owner always comes
        from the token and any student_id (or other unknown field) in the request is ignored.
        Accepts title, description and an optional due_date (YYYY-MM-DD). A task cannot be
        created as completed. Lengths (title 255, description 5000) are provisional technical
        bounds, not approved business rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: The task was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /tasks/{id}:
    patch:
      tags: [Productivity]
      summary: Update a task (partial)
      description: >-
        STUDENT only. Partial update of the student's own task (D-58). Send only the fields to
        change; an empty body changes nothing. completed=true sets completed_at to the server's
        current UTC time (an already completed task keeps its time), and completed=false clears
        it (D-57). The client never sends completed_at, and student_id, id and the timestamps are
        ignored. due_date=null clears the due date. A task that belongs to another student
        answers exactly like a missing one: 404 NOT_FOUND (D-54). There is no GET /tasks/{id}.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Productivity]
      summary: Delete a task permanently
      description: >-
        STUDENT only. Permanently deletes the student's own task; it cannot be undone (D-55). A
        task that belongs to another student, or does not exist, is a 404 NOT_FOUND (D-54).
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: The task was deleted. No response body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /focus-sessions:
    post:
      tags: [Productivity]
      summary: Start a focus session
      description: >-
        STUDENT only: a guest gets 401 and an ADMIN gets 403. Creates a session owned by the
        authenticated student, always with status IN_PROGRESS and session_type FOCUS (D-64);
        it can never be created as COMPLETED or CANCELLED. started_at is generated by the server
        in UTC and finished_at is null (D-66). duration_minutes is the PLANNED duration, an
        integer from 1 to 1440 (a provisional technical limit, not a business rule); it never
        changes afterwards. The optional task_id must be a task of the authenticated student: a
        task that does not exist and a task of another student both return the same 422 on
        task_id (D-68). The owner, status, type and timestamps come from the server; any such
        field in the request is ignored. There is no list or detail endpoint, no delete, no
        break type and no garden endpoint yet; the statistics are GET /focus-statistics (D-88).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFocusSessionRequest'
      responses:
        '201':
          description: The focus session was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /focus-sessions/{id}:
    patch:
      tags: [Productivity]
      summary: Complete or cancel a focus session
      description: >-
        STUDENT only. Changes only the status, and only from IN_PROGRESS to COMPLETED or to
        CANCELLED (D-64). A session that already ended, and a repeated request, is a 422 on
        status. finished_at is generated by the server in UTC at the transition (D-66);
        started_at, duration_minutes, task_id and session_type never change, and any such field
        in the request is ignored. A session is completed only by this explicit request (D-65):
        there is no minimum duration, percentage or automatic completion, so a session can be
        completed immediately after it starts. This is a known risk for the future statistics
        decision. The actual elapsed time is not stored or returned; derive it from started_at
        and finished_at. A session that belongs to another student answers exactly like a
        missing one: 404 NOT_FOUND (D-68). There is no GET or DELETE on this path.
      parameters:
        - $ref: '#/components/parameters/FocusSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFocusSessionRequest'
      responses:
        '200':
          description: The updated focus session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /focus-statistics:
    get:
      tags: [Productivity]
      summary: Focus statistics of a period
      description: >-
        STUDENT only: a guest gets 401 and an ADMIN gets 403. Counts the authenticated student's own ended sessions in a period (D-88). from and to are REQUIRED, inclusive UTC calendar dates (YYYY-MM-DD, from on or before to). The period is from 00:00:00 UTC of from (inclusive) to 00:00:00 UTC of the day after to (exclusive), compared with finished_at, so IN_PROGRESS sessions are never counted. completed_sessions counts COMPLETED sessions only; planned_minutes is the sum of the PLANNED duration_minutes of those COMPLETED sessions only; cancelled_sessions counts CANCELLED sessions separately and is never added to the other two. The actual elapsed time is never calculated. Known risk (D-65): a session can be completed immediately after it starts, so the numbers do not prove real focus time. The day boundaries are UTC, not the student's timezone (question Q-26 is open). A missing, malformed, impossible or reversed date is a 422.
      parameters:
        - name: from
          in: query
          required: true
          description: First day of the period, an inclusive UTC calendar date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last day of the period, an inclusive UTC calendar date (YYYY-MM-DD), not before from.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The three statistics of the period (zeros when there are no sessions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusStatisticsResponse'
        '401':
