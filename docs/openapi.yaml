          $ref: '#/components/schemas/PaginationMeta'
    ResourceType:
      type: string
      description: >-
        Technical identifiers of the six DOCX §9 categories (summaries, lectures, notes,
        exam models, approved references, digital books authorized for sharing).
      enum:
        - SUMMARY
        - LECTURE
        - STUDY_NOTE
        - EXAM_MODEL
        - APPROVED_REFERENCE
        - AUTHORIZED_DIGITAL_BOOK
    ResourceVisibility:
      type: string
      description: >-
        VISIBLE or HIDDEN. A HIDDEN resource must not be reachable by students (answered
        as 404 once student reads exist). There is no default.
      enum: [VISIBLE, HIDDEN]
    LibraryResource:
      type: object
      additionalProperties: false
      required:
        - id
        - subject_id
        - title
        - description
        - resource_type
        - visibility_status
        - file_size
        - mime_type
        - uploaded_by
        - updated_by
        - created_at
        - updated_at
      description: >-
        Admin view of a library resource. The internal storage key (file_path) and the
        original upload name are never part of the response. User references are ids only.
      properties:
        id:
          type: integer
        subject_id:
          type: integer
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        visibility_status:
          $ref: '#/components/schemas/ResourceVisibility'
        file_size:
          type: integer
          description: Size in bytes, measured by the server.
        download_requests:
          type: integer
          minimum: 0
          description: Number of download requests. Included in the admin resource list.
        mime_type:
          type: string
          description: The canonical type of the validated format, never the client-supplied one.
        uploaded_by:
          type: integer
        updated_by:
          type: integer
          nullable: true
          description: Null until the first update.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    LibraryResourceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LibraryResource'
    LibraryResourceList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LibraryResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateLibraryResourceRequest:
      type: object
      description: >-
        multipart/form-data. The maxLength values on title and description are provisional
        technical bounds, not approved business rules. The file limit (20 MiB) is approved.
      required: [subject_id, title, resource_type, visibility_status, file]
      properties:
        subject_id:
          type: integer
          minimum: 1
          description: Must reference an existing subject.
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        visibility_status:
          $ref: '#/components/schemas/ResourceVisibility'
        file:
          type: string
          format: binary
          description: A PDF, DOCX or PPTX of at most 20 MiB (20,480 KiB).
    UpdateLibraryResourceRequest:
      type: object
      description: >-
        Every property is optional; only those sent change. Metadata only: there is no file
        property. The maxLength values are provisional technical bounds.
      properties:
        subject_id:
          type: integer
          minimum: 1
          description: Must reference an existing subject.
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        visibility_status:
          $ref: '#/components/schemas/ResourceVisibility'
    Task:
      type: object
      additionalProperties: false
      required: [id, title, description, due_date, completed_at, created_at, updated_at]
      description: >-
        A student's own task. The owner is not returned. There is no status field: a task is open
        while completed_at is null (D-56).
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        due_date:
          type: string
          format: date
          nullable: true
          description: Calendar date YYYY-MM-DD with no time (D-60).
        completed_at:
          type: string
          nullable: true
          description: Set by the server in UTC (ISO 8601, ending in Z) when the task is completed; null while open.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          type: string
          nullable: true
          description: ISO 8601 UTC timestamp ending in Z.
    TaskResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Task'
    TaskList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateTaskRequest:
      type: object
      required: [title]
      description: >-
        Unknown properties, including student_id, status, completed and completed_at, are
        ignored. The maxLength values are provisional technical bounds, not approved business
        rules.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        due_date:
          type: string
          format: date
          nullable: true
          description: Calendar date YYYY-MM-DD.
    UpdateTaskRequest:
      type: object
      description: >-
        Every property is optional (partial update). Unknown properties, including student_id,
        completed_at, id and the timestamps, are ignored. The maxLength values are provisional
        technical bounds.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        due_date:
          type: string
          format: date
          nullable: true
          description: Calendar date YYYY-MM-DD; null clears it.
        completed:
          type: boolean
          description: true completes the task (server UTC time); false reopens it.
    FocusSession:
      type: object
      additionalProperties: false
      required: [id, task_id, duration_minutes, started_at, finished_at, status, session_type]
      description: >-
        A student's own focus session. The owner is not returned. duration_minutes is the planned
        duration; the actual elapsed time is not stored or returned.
      properties:
        id:
          type: integer
        task_id:
          type: integer
          nullable: true
          description: The linked task, or null. It becomes null if the task is permanently deleted (D-67).
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Planned duration in minutes. The 1 to 1440 range is a provisional technical limit.
        started_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          type: string
          nullable: true
          description: Set by the server in UTC (ISO 8601, ending in Z) at COMPLETED or CANCELLED; null while IN_PROGRESS.
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, CANCELLED]
        session_type:
          type: string
          enum: [FOCUS]
    FocusSessionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FocusSession'
    CreateFocusSessionRequest:
      type: object
      required: [duration_minutes]
      description: >-
        Unknown properties, including student_id, status, session_type and the timestamps, are
        ignored. The duration range is a provisional technical limit.
      properties:
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Planned duration in minutes.
        task_id:
          type: integer
          nullable: true
          description: Optional task of the authenticated student.
    UpdateFocusSessionRequest:
      type: object
      required: [status]
      description: Unknown properties, including task_id, duration_minutes and the timestamps, are ignored.
      properties:
        status:
          type: string
          enum: [COMPLETED, CANCELLED]
    StudentAcademicPlan:
      type: object
      additionalProperties: false
      required: [academic_plan_id, major_id]
      description: The plan the student follows and its major (D-86).
      properties:
        academic_plan_id:
          type: integer
        major_id:
          type: integer
          description: Derived from the plan by the server.
    StudentAcademicPlanResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StudentAcademicPlan'
    InterestQuestion:
      type: object
      additionalProperties: false
      required: [id, code, display_order, text, options]
      properties:
        id:
          type: integer
        code:
          type: string
        display_order:
          type: integer
        text:
          type: string
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, code, display_order, text]
            description: An answer option. Its weights are never returned.
            properties:
              id:
                type: integer
              code:
                type: string
              display_order:
                type: integer
              text:
                type: string
    InterestActiveTestResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, code, version_label, title, question_count, questions]
          properties:
            id:
              type: integer
            code:
              type: string
            version_label:
              type: string
            title:
              type: string
            question_count:
              type: integer
            questions:
              type: array
              items:
                $ref: '#/components/schemas/InterestQuestion'
    InterestAttempt:
      type: object
      additionalProperties: false
      required: [id, test_id, version_label, title, status, started_at, submitted_at, abandoned_at, question_count, answered_count, questions, answers]
      properties:
        id:
          type: integer
        test_id:
          type: integer
          description: The content version this attempt is tied to for its whole life.
        version_label:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [IN_PROGRESS, SUBMITTED, ABANDONED]
        started_at:
          $ref: '#/components/schemas/Timestamp'
        submitted_at:
          type: string
          nullable: true
          format: date-time
        abandoned_at:
          type: string
          nullable: true
          format: date-time
        question_count:
          type: integer
        answered_count:
          type: integer
        questions:
          type: array
          description: The questions of the attempt's OWN version, in display order.
          items:
            $ref: '#/components/schemas/InterestQuestion'
        answers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [question_id, option_id]
            properties:
              question_id:
                type: integer
              option_id:
                type: integer
    InterestAttemptResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/InterestAttempt'
    InterestAttemptList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, test_id, version_label, status, started_at, submitted_at, abandoned_at]
            properties:
              id:
                type: integer
              test_id:
                type: integer
              version_label:
                type: string
              status:
                type: string
                enum: [IN_PROGRESS, SUBMITTED, ABANDONED]
              started_at:
                $ref: '#/components/schemas/Timestamp'
              submitted_at:
                type: string
                nullable: true
                format: date-time
              abandoned_at:
                type: string
                nullable: true
                format: date-time
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    InterestResultResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [attempt_id, test_id, version_label, scoring_method, submitted_at, categories, suggested_majors]
          description: Non-binding guidance indicators only (D-101).
          properties:
            attempt_id:
              type: integer
            test_id:
              type: integer
            version_label:
              type: string
            scoring_method:
              type: string
              enum: [CATEGORY_ATTAINMENT_V1]
            submitted_at:
              $ref: '#/components/schemas/Timestamp'
            categories:
              type: array
              description: >-
                Ordered by rank, then the content's display order. The rank is a competition rank
                (1, 1, 3) on the EXACT fraction raw_score/max_score; equal displayed percentages do
                not imply equal ranks.
              items:
                type: object
                additionalProperties: false
                required: [code, name, description, raw_score, max_score, percentage, rank]
                properties:
                  code:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  raw_score:
                    type: integer
                    minimum: 0
                  max_score:
                    type: integer
                    minimum: 1
                  percentage:
                    type: string
                    pattern: '^(100\.00|[0-9]{1,2}\.[0-9]{2})$'
                    description: raw_score x 100 / max_score rounded half up to EXACTLY two decimals, as a string (display value only).
                  rank:
                    type: integer
                    minimum: 1
            suggested_majors:
              type: array
              maxItems: 0
              items:
                type: object
              description: Reserved; always empty (no category-to-major mapping exists).
    StartInterestAttemptRequest:
      type: object
      description: Optional body. Other properties are ignored.
      properties:
        test_id:
          type: integer
          nullable: true
          minimum: 1
          description: If sent, it must be the active version's id.
    SaveInterestAnswersRequest:
      type: object
      required: [answers]
      description: At most 200 items (a technical limit). Other properties are ignored.
      properties:
        answers:
          type: array
          maxItems: 200
          items:
            type: object
            required: [question_id, option_id]
            properties:
              question_id:
                type: integer
                minimum: 1
              option_id:
                type: integer
                minimum: 1
    StudentCourseAttempt:
      type: object
      additionalProperties: false
      required: [id, course_id, attempt_number, grade, semester_label, source, created_at, updated_at]
      description: >-
        One student-entered, unofficial course attempt (D-96 to D-100). There is deliberately no pass or
        fail status and no calculated field.
      properties:
        id:
          type: integer
          description: The stable identifier of the attempt.
        course_id:
          type: integer
        attempt_number:
          type: integer
          minimum: 1
          description: >-
            Assigned by the server; orders the attempts currently stored for this course. Not a
            historical sequence: a deleted highest number can be assigned again.
        grade:
          type: string
          nullable: true
          pattern: '^(100|[0-9]{1,2}(\.[0-9]{1,4})?)$'
          description: >-
            The exact stored grade as a decimal STRING without trailing zeros, for example "85.5", "0"
            or "100" (stored as DECIMAL(7,4); never converted to a float). null means no final grade has
            been entered; it is not a fail, a pass or an enrolment status. 0 is a real grade.
        semester_label:
          type: string
          nullable: true
          maxLength: 50
          description: Optional display text; never used for ordering or calculation.
        source:
          type: string
          enum: [STUDENT_ENTERED]
          description: Always STUDENT_ENTERED; the record is not an official university record.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    StudentCourseAttemptResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StudentCourseAttempt'
    StudentCourseAttemptList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StudentCourseAttempt'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateStudentCourseAttemptRequest:
      type: object
      required: [course_id]
      description: >-
        attempt_number must not be sent (422). Other unknown fields are ignored. The limits are
        technical validation limits (as D-90), not university policy.
      properties:
        course_id:
          type: integer
          minimum: 1
          description: Any existing catalogue course.
        grade:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: >-
            Optional. At most four decimal places; a numeric string is also accepted. Omitted or null
            means no final grade entered.
        semester_label:
          type: string
          nullable: true
          maxLength: 50
    UpdateStudentCourseAttemptRequest:
      type: object
      description: >-
        At least one of grade or semester_label. An omitted field stays unchanged; null clears it.
        course_id and attempt_number are immutable and are a 422 if sent. Other unknown fields are ignored.
      properties:
