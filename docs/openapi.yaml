      required: true
      description: Marketplace offer id. A non-numeric value, an unknown id, or an offer the caller may not see is a 404.
      schema:
        type: integer
        minimum: 1
    MarketplaceRequestId:
      name: id
      in: path
      required: true
      description: Marketplace request id. A non-numeric value, an unknown id, or a request the caller may not act on is a 404.
      schema:
        type: integer
        minimum: 1
    GraduationProjectId:
      name: id
      in: path
      required: true
      description: Graduation project id. A non-numeric value or an unknown id is a 404.
      schema:
        type: integer
        minimum: 1
    InterestAttemptId:
      name: id
      in: path
      required: true
      description: Interest attempt id. A non-numeric value, or another student's attempt, is a 404.
      schema:
        type: integer
        minimum: 1
    CourseAttemptId:
      name: id
      in: path
      required: true
      description: Course attempt id. A non-numeric value, or another student's attempt, is a 404.
      schema:
        type: integer
        minimum: 1
    ProjectContextEventId:
      name: id
      in: path
      required: true
      description: Event id. A non-numeric value, or an event of another student, is a 404.
      schema:
        type: integer
        minimum: 1
    ProjectApplicationId:
      name: id
      in: path
      required: true
      description: Application id. A non-numeric value, or an application the caller may not act on, is a 404.
      schema:
        type: integer
        minimum: 1
    AdminUserId:
      name: id
      in: path
      required: true
      description: Student account id. A non-numeric value, an admin account or an unknown id is a 404.
      schema:
        type: integer
        minimum: 1
    TaskId:
      name: id
      in: path
      required: true
