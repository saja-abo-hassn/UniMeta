        STUDENT only: a guest gets 401 and an ADMIN gets 403 (the admin does not manage teams). Only the announcements the authenticated student owns (membership in other teams is not listed here). Paginated by id ascending.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of announcements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraduationProjectList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /project-context-events:
    get:
      tags: [Graduation teams]
      summary: List the student's own project notices
      description: >-
        STUDENT only: a guest gets 401 and an ADMIN gets 403. Notices about graduation-project applications addressed to the authenticated student (D-85): APPLICATION_RECEIVED goes to the project owner when someone applies, APPLICATION_ACCEPTED and APPLICATION_REJECTED go to the applicant. A withdrawal creates none. An event is created in the same database transaction as the action it reports. Newest first: ordered by id descending only (ids grow with creation, so events created in the same second keep a stable order on every page; the list is not sorted on created_at). Delivery is by polling only (no WebSockets or push). The unread badge is meta.total of a request with is_read=false. An event carries no message text, email or name. Only the caller's own events are ever listed.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: is_read
          in: query
          required: false
          description: Filter by the read flag (true, false, 1 or 0). An invalid value is a 422.
          schema:
            type: boolean
      responses:
        '200':
          description: A page of the student's events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContextEventList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /project-context-events/{id}/read:
    patch:
      tags: [Graduation teams]
      summary: Mark a notice as read
      description: >-
        STUDENT only. Marks one of the caller's own events as read (D-85). It is idempotent: marking an already-read event answers 200 with the same event. The request body is ignored; nothing else changes and an event can never be marked unread. An event of another student answers exactly like a missing one: 404 NOT_FOUND. There is no create, delete or other write for events.
      parameters:
        - $ref: '#/components/parameters/ProjectContextEventId'
      responses:
        '200':
          description: The event, now read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectContextEventResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/dashboard/overview:
    get:
      tags: [Admin (users)]
      summary: Dashboard indicators (admin, read-only)
      description: >-
        ADMIN only: a guest gets 401 and a student gets 403. Returns the confirmed indicators that
        can be computed today: total_students (the number of STUDENT accounts). The other indicators
        named by the requirement (agreements, reports) are ADDED when their modules exist and are
        never renamed; there are no financial indicators.
      responses:
        '200':
          description: The indicators.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{id}/status:
    patch:
      tags: [Admin (users)]
      summary: Suspend or reactivate a student account (admin)
      description: >-
        ADMIN only: a guest gets 401 and a student gets 403. Changes a STUDENT account between ACTIVE
        and SUSPENDED (owner decision D-81). status and reason are both required: every change,
        reactivation included, needs a written reason (at most 1000 characters, a provisional
        technical bound). A change to the status the account already has is a 422 on status. An
        admin account (including the caller's own) or an unknown id is a 404. The change, the
        revocation of every token of a suspended account, and the audit record (D-82) happen in one
        transaction: if any step fails nothing changes. Suspension has no other automatic effect (no
        change to agreements, announcements, offers, applications, reports or study records). A
        suspended account gets 403 on login (only after a correct password) and on every
        authenticated request.
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountStatusRequest'
      responses:
        '200':
          description: The updated student account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/audit-logs:
    get:
      tags: [Admin (users)]
      summary: Read the audit log (admin, read-only)
      description: >-
        ADMIN only: a guest gets 401 and a student gets 403 (owner decision D-82). The log is
        append-only and written only by the audited operations; there is no write endpoint. Newest
        first (id descending), paginated. Optional EXACT-match filters: action, actor_id,
        entity_type, entity_id; there is no text search, and a malformed value of a filter is a 422
        while unknown query parameters are ignored. Reading the log is not itself audited. details
        contains only the allowlisted fields of the action: ACCOUNT_STATUS_CHANGED has from and to;
        PROJECT_MEMBER_ADDED has project_id and applicant_id. No email, password or token is ever
        stored. There is no automatic deletion until the retention policy is decided (Q-17).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [ACCOUNT_STATUS_CHANGED, PROJECT_MEMBER_ADDED]
        - name: actor_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 32
        - name: entity_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A page of audit records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/users:
    get:
      tags: [Admin (users)]
      summary: List student accounts (admin, read-only)
      description: >-
        ADMIN only: a guest gets 401 and a student gets 403. Lists STUDENT accounts only, paginated by id ascending, with a minimal non-sensitive field set (id, full_name, role, account_status, created_at); the email and every other account field are not returned, because the authorized data and the audit scope are not defined yet (REQ-ADM-03, REQ-ADM-06, question Q-58). Optional exact-match filter account_status (D-84); an invalid value is a 422. There is no text search. Unknown query parameters are ignored.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: account_status
          in: query
          required: false
          description: Exact match on the account status (D-84).
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED]
      responses:
        '200':
          description: A page of student accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
